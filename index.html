      grid.append(c);
    }
    cal.append(hd, grid, h('div', 'cal-note', '✦ 有星星的日子，就是有寫日記'));

    // 上一篇 / 下一篇
    for (const nv of [navTop, navBot]) {
      const pb = h('button', '', '‹ 上一篇'), nb = h('button', '', '下一篇 ›');
      pb.disabled = idx === 0; nb.disabled = idx === chrono.length - 1;
      pb.onclick = () => pick(idx - 1); nb.onclick = () => pick(idx + 1);
      nv.append(pb, h('span', '', '第 ' + (idx + 1) + ' 篇 / 共 ' + chrono.length + ' 篇'), nb);
    }
    box.append(entryCard(cur, idx + 1));
    curEntry = cur; playFor(cur); ensureMedia(cur);
  }

  const lb = h('div'); lb.id = 'lb'; const lbImg = h('img'); lb.append(lbImg); lb.onclick = () => lb.style.display = 'none';
  app.append(cover, letter, lb);
  document.body.prepend(stars(34), petals(9));
  const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=';
  let bgm = null, bgmBtn = null, bgmWanted = true, bgmId = null, opened = false;
  const audioCache = new Map();
  const mkBgm = () => { if (!bgm) { bgm = new Audio(); bgm.loop = true; bgm.volume = 0.5; } return bgm; };
  const unlockBgm = () => { mkBgm(); if (!bgm.src) { bgm.src = SILENT; bgm.play().catch(() => {}); } };
  const setBgmBtn = () => { if (bgmBtn) bgmBtn.textContent = bgm && !bgm.paused ? '🎵' : '🔇'; };
  const ensureBgmBtn = () => {
    if (bgmBtn) return;
    bgmBtn = h('button', 'bgm-btn'); bgmBtn.title = '這篇的背景音樂（點一下暫停／播放）';
    bgmBtn.onclick = () => {
      if (bgm && !bgm.paused) { bgm.pause(); bgmWanted = false; setBgmBtn(); }
      else { bgmWanted = true; if (bgm && bgm.src && bgm.src !== SILENT) bgm.play().then(setBgmBtn, setBgmBtn); else { bgmId = null; if (curEntry) playFor(curEntry); } }
    };
    app.append(bgmBtn);
  };
  let curEntry = null;
  async function ensureMedia(e) {
    if (!(e.artRemote || e.imgRemote) || !mediaLoader || mediaBusy.has(e.id)) return;
    mediaBusy.add(e.id);
    try { const m = await mediaLoader(e.id); mediaCache.set(e.id, { art: m.art || '', images: m.images || [] }); e.art = m.art || ''; e.images = m.images || []; e.artRemote = e.imgRemote = false; }
    catch (err) { mediaBusy.delete(e.id); return; }
    mediaBusy.delete(e.id);
    if (selId === e.id) draw();
  }
  async function playFor(e) {
    if (!opened) return;
    if (!e.audio && !e.audioRemote) { if (bgm) bgm.pause(); bgmId = null; if (bgmBtn) bgmBtn.style.display = 'none'; return; }
    ensureBgmBtn(); bgmBtn.style.display = '';
    if (bgmId === e.id) return;
    bgmId = e.id; mkBgm().pause();
    let src = e.audio || audioCache.get(e.id);
    if (!src) {
      bgmBtn.textContent = '⏳';
      try { src = await audioLoader(e.id); audioCache.set(e.id, src); }
      catch (err) { if (bgmId === e.id) { bgmId = null; bgmBtn.textContent = '⚠️'; } return; }
    }
    if (bgmId !== e.id) return;
    bgm.src = src;
    if (bgmWanted) bgm.play().then(setBgmBtn, setBgmBtn); else setBgmBtn();
  }
  const openLetter = () => { cover.classList.add('gone'); letter.classList.add('show'); scrollTo(0, 0); opened = true; if (curEntry) playFor(curEntry); };
  if (D.live) {
    let pw = ''; try { pw = localStorage.getItem('ll_view') || ''; } catch (e) {}
    const pin = h('input', 'pw'); pin.type = 'password'; pin.placeholder = '請輸入閱讀密碼'; pin.value = pw; pin.autocomplete = 'off';
    const msg = h('div', 'pwmsg');
    cover.insertBefore(pin, ob); cover.append(msg);
    let last = 0;
    audioLoader = async id => {
      const r = await fetch(D.live.url + '/rest/v1/rpc/letter_audio', { method: 'POST', headers: { apikey: D.live.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_view: pw, p_id: id }) });
      if (!r.ok) throw new Error(r.status);
      return JSON.parse(await r.text());
    };
    mediaLoader = async id => {
      const r = await fetch(D.live.url + '/rest/v1/rpc/letter_media', { method: 'POST', headers: { apikey: D.live.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_view: pw, p_id: id }) });
      if (!r.ok) throw new Error(r.status);
      return JSON.parse(await r.text());
    };
    const fetchAll = async p => {
      const r = await fetch(D.live.url + '/rest/v1/rpc/letter_read', { method: 'POST', headers: { apikey: D.live.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_view: p }) });
      const t = await r.text();
      if (!r.ok) throw new Error(/wrong password/.test(t) ? 'wrong' : /no view password/.test(t) ? 'closed' : 'fail');
      D.entries = JSON.parse(t).map(x => ({ id: x.id, date: x.entry_date, mood: x.mood || '', text: x.body || '', art: (mediaCache.get(x.id) || {}).art || '', images: (mediaCache.get(x.id) || {}).images || [], artRemote: !!x.has_art && !mediaCache.has(x.id), imgRemote: x.n_images > 0 && !mediaCache.has(x.id), audio: '', audioRemote: !!x.has_audio, audioKb: x.audio_kb || 0, audioName: x.audio_name || '' }));
      last = Date.now(); pw = p; draw();
    };
    ob.onclick = async () => {
      msg.textContent = '';
      if (!pin.value) { msg.textContent = '請先輸入密碼'; return; }
      unlockBgm(); ob.disabled = true; ob.textContent = '確認中…';
      try {
        await fetchAll(pin.value);
        try { localStorage.setItem('ll_view', pin.value); } catch (e) {}
        openLetter();
        if (!D.entries.length) box.append(h('div', 'quote', '還沒有內容，晚點再來看看 ✦'));
      } catch (e) { msg.textContent = e.message === 'wrong' ? '密碼不對喔' : e.message === 'closed' ? '信還沒有開放閱讀' : '暫時讀不到，請稍後再試'; }
      ob.disabled = false; ob.textContent = '拆開信';
    };
    pin.onkeydown = ev => { if (ev.key === 'Enter') ob.click(); };
    document.addEventListener('visibilitychange', () => { if (!document.hidden && pw && Date.now() - last > 120000) fetchAll(pw).catch(() => {}); });
  } else { ob.onclick = openLetter; draw(); }
}
viewerMain();</script></body></html>
